<link rel="stylesheet" href="../css/header.css">

<header class="cabecalho-principal">
    <div class="container-cabecalho">
        <!-- Logotipo -->
        <a href="index.html" class="logo-cabecalho">
            <img src="../icons/logo-barberdeck.svg" alt="Logotipo BarberDeck">
        </a>

        <!-- Menu de Navegação Central -->
        <nav class="navegacao-cabecalho" aria-label="Navegação Principal">

            <!-- Checkbox invisível para controle de abertura/fechamento no mobile -->
            <input type="checkbox" id="alternar-menu" class="alternar-menu" aria-label="Abrir Menu">

            <!-- Ícone que substitui os links no mobile -->
            <label for="alternar-menu" class="botao-icone-menu" aria-label="Menu">
                <img src="../icons/icon-menu.svg" alt="Abrir menu de navegação">
            </label>

            <!-- Lista de links atualizada dinamicamente conforme o estado do usuário (Visitante, Cliente ou Barbearia) -->
            <ul class="lista-navegacao" id="lista-navegacao-cabecalho">
                <li data-visivel-para="visitante cliente"><a href="index.html#barbearias-destaque">Barbearias</a></li>
                <li data-visivel-para="cliente"><a href="agenda.html">Agenda</a></li>
                <li data-visivel-para="barbearia" hidden><a href="agenda.html?modo=barbearia">Agendamentos</a></li>
                <li data-visivel-para="barbearia" hidden><a href="dashboard.html">Dashboard</a></li>
                <li data-visivel-para="visitante cliente"><a href="index.html#como-funciona">Como Funciona</a></li>
                <li data-visivel-para="visitante cliente"><a href="index.html#planos">Para Barbearias</a></li>
            </ul>
        </nav>

        <!-- Ações à Direita: Botão Entrar (visitante) OU Nome + Foto de Perfil (cliente / barbearia) -->
        <div class="acoes-cabecalho">
            <button type="button" class="botao-entrar" id="botao-abrir-modal" aria-haspopup="dialog" aria-controls="modal-autenticacao" hidden>
                Entrar
            </button>

            <a href="perfil.html" class="botao-perfil-cabecalho" id="link-perfil-cabecalho" title="Abrir configurações e edição da conta">
                <span class="nome-perfil-cabecalho" id="nome-usuario-cabecalho">João Pedro da Silva</span>
                <figure class="foto-perfil-cabecalho">
                    <img src="../images/imagem-topo-client.jpg" alt="Foto de perfil da conta" id="img-usuario-cabecalho">
                </figure>
            </a>
        </div>
    </div>
</header>

<!-- POPUP DE LOGIN E RECUPERAÇÃO DE SENHA -->
<dialog class="modal-autenticacao" id="modal-autenticacao">
    <div class="cartao-modal">

        <!-- BOTÃO FECHAR: X -->
        <button type="button" class="botao-fechar" id="botao-fechar-modal" aria-label="Fechar">
            <img src="../icons/icon-x.svg" alt="" aria-hidden="true">
        </button>

        <!-- ALTERNADOR ENTRAR (ATIVO) / IR PARA PÁGINA DE CADASTRO -->
        <div class="abas-alternancia" role="navigation" aria-label="Modo de autenticação">
            <button type="button" class="botao-aba ativo" id="aba-entrar" aria-current="true">
                Entrar
            </button>
            <a href="cadastro.html" class="botao-aba" id="aba-cadastrar">
                Cadastrar
            </a>
        </div>

        <!-- FORMULÁRIO DE ENTRADA -->
        <form class="formulario-autenticacao" id="formulario-entrar" novalidate>
            <p class="mensagem-feedback-modal" id="feedback-login" hidden></p>

            <div class="grupo-formulario">
                <label for="entrar-email">E-mail</label>
                <input type="email" id="entrar-email" name="email" placeholder="Ex: seuemail@exemplo.com" required>
            </div>

            <div class="grupo-formulario">
                <label for="entrar-senha">Senha</label>
                <input type="password" id="entrar-senha" name="senha" placeholder="Ex: Digite sua senha" required>
                <button type="button" class="link-esqueci-senha" id="botao-esqueci-senha">esqueci a senha</button>
            </div>

            <button type="submit" class="botao-enviar">Entrar</button>

            <div class="acesso-rapido-modal">
                <span class="rotulo-acesso-rapido">Acesso rápido (demonstração):</span>
                <div class="botoes-acesso-rapido">
                    <button type="button" class="botao-demo-login" data-login-rapido="cliente">
                        Cliente
                    </button>
                    <button type="button" class="botao-demo-login" data-login-rapido="barbearia">
                        Barbearia
                    </button>
                </div>
            </div>
        </form>

        <!-- FORMULÁRIO DE RECUPERAÇÃO DE SENHA (OCULTO POR PADRÃO) -->
        <form class="formulario-autenticacao" id="formulario-recuperar-senha" hidden novalidate>
            <h3 class="titulo-recuperar-senha">Recuperar Senha</h3>
            <p class="descricao-recuperar-senha">Informe o e-mail cadastrado para receber o link de redefinição.</p>
            <p class="mensagem-feedback-modal" id="feedback-recuperacao" hidden></p>

            <div class="grupo-formulario">
                <label for="recuperar-email">E-mail da conta</label>
                <input type="email" id="recuperar-email" name="email_recuperacao" placeholder="Ex: seuemail@exemplo.com" required>
            </div>

            <button type="submit" class="botao-enviar">Enviar Link de Recuperação</button>
            <button type="button" class="botao-voltar-login" id="botao-voltar-login">Voltar para o Login</button>
        </form>

    </div>
</dialog>
