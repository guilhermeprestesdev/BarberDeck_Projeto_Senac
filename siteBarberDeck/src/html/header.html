<link rel="stylesheet" href="../css/header.css">

<header class="cabecalho-principal">
    <div class="container-cabecalho">
        <!-- Logotipo -->
        <a href="index.html" class="logo-cabecalho">
            <img src="../icons/logo-barberdeck.svg" alt="BarberDeck">
        </a>

        <!-- Menu de Navegação Central -->
        <nav class="navegacao-cabecalho" aria-label="Navegação Principal">

            <!-- Checkbox invisível para controle de abertura/fechamento -->
            <input type="checkbox" id="alternar-menu" class="alternar-menu" aria-label="Abrir Menu">

            <!-- Ícone que substitui os links no mobile -->
            <label for="alternar-menu" class="botao-icone-menu" aria-label="Menu">
                <img src="../icons/icon-menu.svg" alt="Menu">
            </label>

            <ul class="lista-navegacao">
                <li><a href="index.html#barbearias-destaque">Barbearias</a></li>
                <li><a href="agenda.html">Agenda</a></li>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="index.html#como-funciona">Como Funciona</a></li>
                <li><a href="index.html#planos">Para Barbearias</a></li>
            </ul>
        </nav>

        <!-- Botão de Ação / Entrar -->
        <div class="acoes-cabecalho">
            <button type="button" class="botao-entrar" id="botao-abrir-modal" aria-haspopup="dialog" aria-controls="modal-autenticacao">Entrar</button>
        </div>
    </div>
</header>

<!-- POPUP EXCLUSIVO DE LOGIN (ENTRAR) -->
<dialog class="modal-autenticacao" id="modal-autenticacao">
    <div class="cartao-modal">

        <!-- BOTÃO FECHAR: X -->
        <button type="button" class="botao-fechar" id="botao-fechar-modal" aria-label="Fechar">
            <img src="../icons/icon-x.svg" alt="" aria-hidden="true">
        </button>

        <!-- ALTERNADOR ENTRAR (ATIVO) / IR PARA PÁGINA DE CADASTRO -->
        <div class="abas-alternancia" role="navigation" aria-label="Modo de autenticação">
            <button type="button" class="botao-aba ativo" id="aba-entrar" aria-current="true">
                Entrar
            </button>
            <a href="cadastro.html" class="botao-aba" id="aba-cadastrar">
                Cadastrar
            </a>
        </div>

        <!-- FORMULÁRIO DE ENTRADA -->
        <form class="formulario-autenticacao" id="formulario-entrar">
            <div class="grupo-formulario">
                <label for="entrar-email">E-mail</label>
                <input type="email" id="entrar-email" name="email" placeholder="Ex: seuemail@exemplo.com" required>
            </div>

            <div class="grupo-formulario">
                <label for="entrar-senha">Senha</label>
                <input type="password" id="entrar-senha" name="senha" placeholder="Ex: Digite sua senha" required>
                <a href="#recuperar-senha" class="link-esqueci-senha">esqueci a senha</a>
            </div>

            <button type="submit" class="botao-enviar">Entrar</button>
        </form>

    </div>
</dialog>
