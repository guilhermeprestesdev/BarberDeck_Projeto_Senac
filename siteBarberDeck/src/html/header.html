<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <link rel="stylesheet" href="../css/header.css">
</head>

<body>

    <header class="main-header">
        <div class="header-container">
            <!-- Logotipo -->
            <a href="/" class="header-logo">
                <img src="../icons/logo-barberdeck.svg" alt="BarberDeck">
            </a>

            <!-- Menu de Navegação Central -->
            <nav class="header-nav" aria-label="Navegação Principal">

                <!-- Checkbox invisível para controle de abertura/fechamento -->
                <input type="checkbox" id="menu-toggle" class="menu-toggle" aria-label="Abrir Menu">

                <!-- Ícone que substitui os links no mobile -->
                <label for="menu-toggle" class="btn-menu-icon" aria-label="Menu">
                    <img src="../icons/icon-menu.svg" alt="Menu">
                </label>

                <ul class="nav-list">
                    <li><a href="#barbearias">Barbearias</a></li>
                    <li><a href="#como-funciona">Como Funciona</a></li>
                    <li><a href="#para-barbearias">Para Barbearias</a></li>
                </ul>
            </nav>

            <!-- Botão de Ação / Login -->
            <div class="header-actions">
                <a href="/login" class="btn-login">Login</a>
            </div>
        </div>
    </header>

    <!-- POPUP LOGIN / CADASTRAR -->
    <dialog class="modal-auth" id="modal-auth">
        <div class="modal-card">

            <!-- BOTÃO FECHAR: X -->
            <button type="button" class="btn-close" id="btn-close-modal" aria-label="Fechar">
                <img src="../icons/icon-x.svg" alt="" aria-hidden="true">
            </button>

            <!-- 1º NÍVEL: TOGGLE LOGIN / CADASTRAR -->
            <div class="toggle-tabs" role="tablist" aria-label="Modo de autenticação">
                <button type="button" class="tab-btn active" id="tab-login" role="tab" aria-selected="true"
                    aria-controls="form-login">
                    Login
                </button>
                <button type="button" class="tab-btn" id="tab-register" role="tab" aria-selected="false"
                    aria-controls="view-register">
                    Cadastrar
                </button>
            </div>

            <!-- PAINEL 1: FORMULÁRIO DE LOGIN -->
            <form class="auth-form" id="form-login" role="tabpanel" aria-labelledby="tab-login">
                <div class="form-group">
                    <label for="login-email">Email</label>
                    <input type="email" id="login-email" name="email" required>
                </div>

                <div class="form-group">
                    <label for="login-senha">Senha</label>
                    <input type="password" id="login-senha" name="senha" required>
                    <a href="#recuperar-senha" class="forgot-link">esqueci a senha</a>
                </div>

                <button type="submit" class="btn-submit">Entrar</button>
            </form>

            <!-- PAINEL 2: ÁREA DE CADASTRO (CLIENTE / BARBEARIA) -->
            <div class="register-container" id="view-register" role="tabpanel" aria-labelledby="tab-register" hidden>

                <!-- 2º NÍVEL: SELETOR DE PERFIL (CLIENTE OU BARBEARIA) -->
                <div class="profile-selector" role="tablist" aria-label="Tipo de conta">
                    <button type="button" class="profile-card active" id="btn-tipo-cliente" role="tab"
                        aria-selected="true" aria-controls="form-cadastro-cliente">
                        <img src="../icons/icon-user.svg" alt="" class="profile-icon" aria-hidden="true">
                        <span class="profile-title">Cliente</span>
                        <span class="profile-desc">Agende seus horários</span>
                    </button>

                    <button type="button" class="profile-card" id="btn-tipo-barbearia" role="tab" aria-selected="false"
                        aria-controls="form-cadastro-barbearia">
                        <img src="../icons/icon-barbearia.svg" alt="" class="profile-icon" aria-hidden="true">
                        <span class="profile-title">Barbearia</span>
                        <span class="profile-desc">Gerencie seu negócio</span>
                    </button>
                </div>

                <!-- FORMULÁRIO 2A: CADASTRO CLIENTE -->
                <form class="auth-form" id="form-cadastro-cliente" role="tabpanel" aria-labelledby="btn-tipo-cliente">
                    <div class="form-group full-width">
                        <label for="cliente-nome">Nome Completo</label>
                        <input type="text" id="cliente-nome" name="nome" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-whatsapp">WhatsApp</label>
                            <input type="tel" id="cliente-whatsapp" name="whatsapp" placeholder="(00) 00000-0000"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="cliente-cidade">Cidade</label>
                            <input type="text" id="cliente-cidade" name="cidade" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="cliente-email">Email</label>
                            <input type="email" id="cliente-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="cliente-senha">Senha</label>
                            <input type="password" id="cliente-senha" name="senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Criar conta</button>
                </form>

                <!-- FORMULÁRIO 2B: CADASTRO BARBEARIA -->
                <form class="auth-form" id="form-cadastro-barbearia" role="tabpanel"
                    aria-labelledby="btn-tipo-barbearia" hidden>
                    <div class="form-group full-width">
                        <label for="barbearia-nome">Nome da Empresa</label>
                        <input type="text" id="barbearia-nome" name="nome_empresa" required>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="barbearia-cnpj">CNPJ</label>
                            <input type="text" id="barbearia-cnpj" name="cnpj" placeholder="00.000.000/0000-00"
                                required>
                        </div>
                        <div class="form-group">
                            <label for="barbearia-whatsapp">WhatsApp</label>
                            <input type="tel" id="barbearia-whatsapp" name="whatsapp" placeholder="(00) 00000-0000"
                                required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="barbearia-cep">CEP</label>
                            <input type="text" id="barbearia-cep" name="cep" placeholder="00000-000" required>
                        </div>
                        <div class="form-group">
                            <label for="barbearia-cidade">Cidade</label>
                            <input type="text" id="barbearia-cidade" name="cidade" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="barbearia-bairro">Bairro</label>
                            <input type="text" id="barbearia-bairro" name="bairro" required>
                        </div>
                        <div class="form-group">
                            <label for="barbearia-logradouro">Logradouro</label>
                            <input type="text" id="barbearia-logradouro" name="logradouro" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="barbearia-email">Email</label>
                            <input type="email" id="barbearia-email" name="email" required>
                        </div>
                        <div class="form-group">
                            <label for="barbearia-senha">Senha</label>
                            <input type="password" id="barbearia-senha" name="senha" required>
                        </div>
                    </div>

                    <button type="submit" class="btn-submit">Criar conta</button>
                </form>

            </div>

        </div>
    </dialog>
</body>

</html>
